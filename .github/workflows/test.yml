name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: dev/langs/go/go.mod
          cache-dependency-path: dev/langs/go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # Includes the check that the committed dist/ matches a fresh build.
      - run: npm test
      - run: npm run check:ts
      - run: npm run check:langs
      # A quick fixed-seed run of the random models test; run more seeds by hand.
      - run: npm run fuzz:models -- 1 200
      # cgo works here, unlike on the Windows dev machine.
      - run: go test -race ./...
        working-directory: dev/langs/go

  # The oldest Python and Rust the generated headers promise (Python >= 3.10, Rust >= 1.80).
  minimums:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-go@v5
        with:
          go-version-file: dev/langs/go/go.mod
          cache-dependency-path: dev/langs/go/go.sum
      - uses: dtolnay/rust-toolchain@1.80
      - run: npm ci
      - run: npm run check:langs

  # dist/go/go.mod says go 1.21; build the package as shipped on that Go, in a copy (dist has no go.sum).
  go-minimum:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false
      - run: cp -r dist/go "$RUNNER_TEMP/scalars"
      - run: go mod tidy && go vet ./... && go build ./...
        working-directory: ${{ runner.temp }}/scalars
